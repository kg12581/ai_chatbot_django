services:
  web:
    build: .
    image: nocturne-ai:latest
    container_name: nocturne-web
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    # .env 全部变量注入容器（.env 放在 compose 同目录，由部署机/Jenkins 提供）
    env_file:
      - .env
    environment:
      # 直接使用 .env 中配置的 MySQL 连接（默认 192.168.3.100）
      DB_HOST: ${DB_HOST:-192.168.3.100}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ai_chatbot}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Admin@123456}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - .:/app
      - /root/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
