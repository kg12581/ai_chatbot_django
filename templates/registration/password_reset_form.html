{% extends "base.html" %}

{% block title %}找回密码 — Nocturne AI{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8 animate-fade-up">
            <h1 class="font-display text-3xl font-semibold tracking-tight">找回密码</h1>
            <p class="text-nocturne-text-muted mt-2 text-sm">输入注册邮箱，我们将发送密码重置链接</p>
        </div>

        <form method="post" class="bg-nocturne-surface/60 border border-nocturne-border/50 rounded-2xl p-8 backdrop-blur-sm animate-fade-up" style="animation-delay:0.1s">
            {% csrf_token %}

            {% if form.errors %}
            <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                请输入有效的邮箱地址。
            </div>
            {% endif %}

            <div class="mb-6">
                <label class="block text-sm text-nocturne-text-muted mb-2">邮箱地址</label>
                <input type="email" name="email" autocomplete="email" required
                    class="w-full px-4 py-3 bg-nocturne-bg border border-nocturne-border rounded-xl text-nocturne-text-primary focus:outline-none focus:border-nocturne-mint/50 focus:ring-1 focus:ring-nocturne-mint/30 transition-colors"
                    placeholder="you@example.com">
            </div>

            <button type="submit"
                class="w-full py-3 bg-nocturne-mint text-nocturne-bg font-medium rounded-xl hover:opacity-90 transition-opacity">
                发送重置邮件
            </button>

            <div class="mt-4 text-center">
                <a href="{% url 'login' %}" class="text-sm text-nocturne-text-dim hover:text-nocturne-mint transition-colors">
                    返回登录
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
