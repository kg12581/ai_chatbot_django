{% extends "base.html" %}

{% block title %}设置新密码 — Nocturne AI{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8 animate-fade-up">
            <h1 class="font-display text-3xl font-semibold tracking-tight">设置新密码</h1>
            <p class="text-nocturne-text-muted mt-2 text-sm">请输入你的新密码</p>
        </div>

        {% if validlink %}
        <form method="post" class="bg-nocturne-surface/60 border border-nocturne-border/50 rounded-2xl p-8 backdrop-blur-sm animate-fade-up" style="animation-delay:0.1s">
            {% csrf_token %}

            {% if form.errors %}
            <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                密码不符合要求，请重试。
            </div>
            {% endif %}

            <div class="mb-5">
                <label class="block text-sm text-nocturne-text-muted mb-2">新密码</label>
                <input type="password" name="new_password1" autocomplete="new-password" required
                    class="w-full px-4 py-3 bg-nocturne-bg border border-nocturne-border rounded-xl text-nocturne-text-primary focus:outline-none focus:border-nocturne-mint/50 focus:ring-1 focus:ring-nocturne-mint/30 transition-colors"
                    placeholder="至少 8 位">
            </div>

            <div class="mb-6">
                <label class="block text-sm text-nocturne-text-muted mb-2">确认新密码</label>
                <input type="password" name="new_password2" autocomplete="new-password" required
                    class="w-full px-4 py-3 bg-nocturne-bg border border-nocturne-border rounded-xl text-nocturne-text-primary focus:outline-none focus:border-nocturne-mint/50 focus:ring-1 focus:ring-nocturne-mint/30 transition-colors"
                    placeholder="再次输入新密码">
            </div>

            <button type="submit"
                class="w-full py-3 bg-nocturne-mint text-nocturne-bg font-medium rounded-xl hover:opacity-90 transition-opacity">
                重置密码
            </button>
        </form>
        {% else %}
        <div class="bg-nocturne-surface/60 border border-nocturne-border/50 rounded-2xl p-8 text-center animate-fade-up">
            <p class="text-red-400 mb-4">密码重置链接无效或已过期。</p>
            <a href="{% url 'password_reset' %}" class="text-nocturne-mint hover:underline">重新申请重置邮件</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
