{% extends "base.html" %}

{% block title %}邮件已发送 — Nocturne AI{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md text-center animate-fade-up">
        <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-nocturne-mint/10 border border-nocturne-mint/30 flex items-center justify-center">
            <i data-lucide="mail-check" class="w-8 h-8 text-nocturne-mint"></i>
        </div>
        <h1 class="font-display text-3xl font-semibold tracking-tight mb-3">邮件已发送</h1>
        <p class="text-nocturne-text-muted text-sm mb-8">
            如果该邮箱已注册，重置链接已发送至你的邮箱，请注意查收。
        </p>
        <a href="{% url 'login' %}" class="inline-block px-6 py-3 bg-nocturne-mint text-nocturne-bg font-medium rounded-xl hover:opacity-90 transition-opacity">
            返回登录
        </a>
    </div>
</div>
{% endblock %}
