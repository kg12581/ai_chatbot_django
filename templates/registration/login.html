{% extends "base.html" %}

{% block title %}登录 — Nocturne AI{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8 animate-fade-up">
            <h1 class="font-display text-3xl font-semibold tracking-tight">欢迎回来</h1>
            <p class="text-nocturne-text-muted mt-2 text-sm">登录以继续使用 Nocturne AI</p>
        </div>

        <form method="post" class="bg-nocturne-surface/60 border border-nocturne-border/50 rounded-2xl p-8 backdrop-blur-sm animate-fade-up" style="animation-delay:0.1s">
            {% csrf_token %}

            {% if form.errors %}
            <div class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                用户名或密码错误，请重试。
            </div>
            {% endif %}

            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="mb-5">
                <label class="block text-sm text-nocturne-text-muted mb-2">用户名</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username"
                    value="{{ form.username.value|default:'' }}"
                    class="w-full px-4 py-3 bg-nocturne-bg border border-nocturne-border rounded-xl text-nocturne-text-primary focus:outline-none focus:border-nocturne-mint/50 focus:ring-1 focus:ring-nocturne-mint/30 transition-colors"
                    placeholder="请输入用户名">
            </div>

            <div class="mb-6">
                <label class="block text-sm text-nocturne-text-muted mb-2">密码</label>
                <input type="password" name="password" autocomplete="current-password"
                    class="w-full px-4 py-3 bg-nocturne-bg border border-nocturne-border rounded-xl text-nocturne-text-primary focus:outline-none focus:border-nocturne-mint/50 focus:ring-1 focus:ring-nocturne-mint/30 transition-colors"
                    placeholder="请输入密码">
            </div>

            <button type="submit"
                class="w-full py-3 bg-nocturne-mint text-nocturne-bg font-medium rounded-xl hover:opacity-90 transition-opacity">
                登录
            </button>

            <div class="mt-4 text-center">
                <a href="{% url 'password_reset' %}" class="text-sm text-nocturne-text-dim hover:text-nocturne-mint transition-colors">
                    忘记密码?
                </a>
            </div>
        </form>

        <p class="text-center text-xs text-nocturne-text-dim mt-6">
            Nocturne AI · 暗夜中的优雅智能
        </p>
    </div>
</div>
{% endblock %}
